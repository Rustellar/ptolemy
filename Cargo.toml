[package]
name = "ptolemy"
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Yasu"]
description = "Collection of libraries for the Rustellar project."

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde-jsonlines = "0.7.0"
serde_json = "1.0.143"
