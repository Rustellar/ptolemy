[package]
name = "ptolemy"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Yasu"]
description = "Collection of libraries for the Rustellar project."

[features]
default = ["clap/derive"]
full = ["convert"]
convert = ["encoding_rs", "encoding_rs_io", "regex"]
json = ["serde/derive", "serde-jsonlines", "serde_json"]
kana = ["regex"]

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
encoding_rs = { version = "0.8.35", optional = true }
encoding_rs_io = { version = "0.1.7", optional = true }
regex = { version = "1.11.2", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde-jsonlines = { version = "0.7.0", optional = true}
serde_json = { version = "1.0.143", optional = true }
